[tool.poetry]
name = "pynetdicom2"
version = "0.9.8"
description = "pynetdicom2 is a pure python package implementing the DICOM network protocol"
authors = ["Pavel 'Blane' Tuchin <blane.public@gmail.com>"]

license = "MIT"

readme = "README.rst"

keywords = ["medical", "dicom", "network"]

repository = "https://github.com/blanebf/pynetdicom2"
homepage = "https://github.com/blanebf/pynetdicom2"
documentation = "https://pynetdicom2.readthedocs.io/en/latest/"

classifiers = [
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    # 3.9 support is transitional: to drop it, remove this classifier and the
    # matching entries in `python`, `[tool.mypy]` and the CI matrix.
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries"
]

[tool.poetry.dependencies]
python = "^3.9"
pydicom = ">=2.4,<4"

# These tool versions all support Python 3.9 today, so a single constraint
# works for every interpreter. Poetry also resolves them per-interpreter, so
# when a tool later drops 3.9 its newest releases are used only on newer
# Pythons. If a tool ever needs a *different* version on 3.9, pin it with the
# multiple-constraints syntax, e.g.:
#   pylint = [
#       { version = "^3.4", python = ">=3.10" },
#       { version = "^3.3.0", python = "~3.9" },  # last release on 3.9
#   ]
# Dropping 3.9 later then only requires deleting the `~3.9` entries.
[tool.poetry.group.dev.dependencies]
pylint = "^3.3.0"
mypy = "^1.10.1"
flake8 = "^7.3.0"
coverage = "7.10.7"
# Sphinx drops old Pythons regularly, so each supported interpreter gets the
# newest series that still supports it.
sphinx = [
    { version = "~7.4.7", python = "~3.9" },   # last series supporting 3.9
    { version = "~8.1.3", python = "~3.10" },  # last series supporting 3.10
    { version = "~9.0.4", python = "~3.11" },  # last series supporting 3.11
    { version = "^9.1.0", python = ">=3.12" },
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
# Kept at the lowest supported interpreter so the code stays valid on all of
# them; bump this when the lower bound is raised (e.g. back to 3.10 when 3.9
# support is removed).
python_version = "3.9"
files = ["pynetdicom2"]
warn_unused_configs = true

[tool.coverage.run]
source = ["pynetdicom2"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
